# ─────────────────────────────────────────────────────────────────────────────
# netlify.toml
#
# This file is REQUIRED for Next.js SSR on Netlify.
# Without it, Netlify treats the build as a static export and server
# components (including DashboardLayout's getServerSession call) never run,
# causing every /dashboard visit to immediately redirect to /login.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "pnpm run build"
  publish = ".next"

# Use the official Netlify Next.js runtime so SSR, server components,
# and route handlers all work correctly.
[[plugins]]
  package = "@netlify/plugin-nextjs"
